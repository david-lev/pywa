# Read the Docs configuration file (Zensical, see docs-mkdocs/README.md)
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - pip install -r docs-mkdocs/requirements.txt .
    - docs-mkdocs/build_zensical.sh
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - cp -R site/. $READTHEDOCS_OUTPUT/html/
