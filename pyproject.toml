[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["pywa", "pywa_async"]
module-root = ""

[project]
name = "pywa"
version = "4.3.1"
description = "🚀 Build WhatsApp Bots in Python • Fast, Effortless, Powerful"
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
]
requires-python = ">=3.10"
authors = [
    { name = "David Lev", email = "david@davidlev.dev" },
]
maintainers = [
    { name = "David Lev", email = "david@davidlev.dev" },
    { name = "Yehuda Lev", email = "yehuda@yehudalev.com" },
]
keywords = [
    "whatsapp",
    "whatsapp-cloud-api",
    "meta-whatsapp-api",
    "whatsapp-webhook",
    "whatsapp-templates",
    "whatsapp-flows",
    "whatsapp-calling",
    "whatsapp-bot",
    "pywa",
    "asyncio",
    "async",
    "chatbot-framework",
    "webhook-handler",
    "automation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
server = [
    "starlette>=0.32.0",
    "uvicorn[standard]>=0.25.0"
]
flask = ["flask[async]"]
fastapi = ["fastapi[standard]"]
cryptography = ["cryptography"]

[dependency-groups]
dev = [
    "pytest~=9.0",
    "pytest-cov~=7.0",
    "pytest-asyncio~=1.3",
    "pytest-mock~=3.15",
    "ruff~=0.16",
    "ty>=0.0.65",
    "pre-commit~=4.5",
    "cryptography>=46,<47",
    "python-dotenv~=1.0",
    "fastapi>=0.115,<1.0",
    "flask[async]",
    "ngrok~=1.0",
    "uvicorn[standard]>=0.25.0",
    "tomli>=2.0; python_version<'3.11'",
]
docs = [
    "sphinx-book-theme~=1.1",
    "sphinx-copybutton~=0.5",
    "sphinxext-opengraph~=0.13",
    "sphinx-togglebutton~=0.4",
    "myst-parser~=4.0",
    "sphinxcontrib-googleanalytics~=0.5",
    "sphinx-last-updated-by-git~=0.3",
    "sphinx-favicon~=1.0",
]

[project.scripts]
pywa = "pywa.cli:main"

[project.urls]
"Documentation" = "https://pywa.readthedocs.io/"
"Issue Tracker" = "https://github.com/david-lev/pywa/issues"
"Source Code" = "https://github.com/david-lev/pywa"
"Funding" = "https://github.com/sponsors/david-lev"
"Changelog" = "https://github.com/david-lev/pywa/blob/master/CHANGELOG.md"

[tool.ruff]
extend-exclude = [
    "pywa*/__init__.py",
]

[tool.ruff.lint]
ignore = [
    "PLC0414", # `pywa_async` re-exports `pywa` names as `from pywa.X import Y as Y` on purpose
    "PYI019", # `Self` needs Python 3.11+; pywa supports 3.10+ without `typing_extensions`
]

[tool.ty.src]
include = ["pywa*"]

[[tool.ty.overrides]]
# `pywa_async` mirrors `pywa` but overrides every networking method as `async def`,
# which is intentionally not Liskov-substitutable for the sync base class.
include = ["pywa_async/**"]

[tool.ty.overrides.rules]
invalid-method-override = "ignore"

[tool.coverage.run]
source = ["pywa", "pywa_async"]
omit = ["pywa/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "\\.\\.\\.",
]
