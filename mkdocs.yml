site_name: Pywa
site_description: Build WhatsApp Bots in Python • Fast, Effortless, Powerful
site_url: https://pywa.readthedocs.io/en/latest/
repo_url: https://github.com/david-lev/pywa
repo_name: david-lev/pywa
edit_uri: edit/master/docs-mkdocs/docs/
docs_dir: docs-mkdocs/docs
use_directory_urls: true
copyright: Copyright © David Lev
theme:
  name: material
  logo: _static/pywa-logo.png
  favicon: _static/favicon.ico
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: green
    accent: teal
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: green
    accent: teal
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.sections
  - navigation.top
  - navigation.indexes
  - toc.follow
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.code.annotate
  - content.action.edit
plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths:
        - .
        options:
          docstring_style: google
          show_source: false
          show_root_heading: true
          show_root_full_path: false
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          members_order: source
          separate_signature: true
          show_signature_annotations: true
          signature_crossrefs: true
          merge_init_into_class: false
          docstring_section_style: table
          heading_level: 3
          inherited_members: false
          show_if_no_docstring: false
          extensions:
          - docs-mkdocs/tools/pywa_griffe_ext.py
        inventories:
        - https://docs.python.org/3/objects.inv
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.snippets:
    base_path:
    - .
    check_paths: true
- pymdownx.tabbed
- pymdownx.emoji
extra:
  analytics:
    provider: google
    property: G-N8G048V8GB
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/david-lev/pywa
  - icon: fontawesome/brands/python
    link: https://pypi.org/project/pywa/
  - icon: fontawesome/brands/telegram
    link: https://t.me/py_wa
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/copy-clean.js
- javascripts/anchor-aliases.js
- javascripts/anchor-redirect.js
